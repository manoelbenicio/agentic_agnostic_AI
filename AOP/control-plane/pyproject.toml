[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aop-control-plane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.138.1",
  "uvicorn==0.49.0",
  "pydantic==2.13.4",
  "psycopg[binary]==3.3.4",
  "redis==8.0.1",
  "websockets==15.0.1",
  "prometheus-client==0.25.0",
  "pytest==9.1.1",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
